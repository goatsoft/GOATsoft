name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-goatsoft-io
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter goatsoft.io run build
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://goatsoft.io/
      # Source lives here (the monorepo); the built site is published to the
      # goatsoft.io repo, which serves it via Pages. @see ADR 0008
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: goatsoft/goatsoft.io
          publish_branch: main
          publish_dir: apps/goatsoft.io/dist
          cname: goatsoft.io
          force_orphan: true
