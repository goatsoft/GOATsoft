name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # An org site (goatsoft.github.io) deploys at "/"; a project site deploys at "/<repo>/".
      - name: Resolve base path
        id: base
        run: |
          if [[ "${GITHUB_REPOSITORY##*/}" == *.github.io ]]; then echo "base=/" >> "$GITHUB_OUTPUT"; else echo "base=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_OUTPUT"; fi
      # check = build (which also generates the auto-import typings) + typecheck + tests + prose.
      - run: npm run check
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io${{ steps.base.outputs.base }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
