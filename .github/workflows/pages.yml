name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-goatsoft-io
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter goatsoft.io run build
        env:
          VITE_BASE: /
          VITE_SITE_URL: https://goatsoft.io/
      # Source lives here (the monorepo); the built site is published to the
      # goatsoft.io repo, which serves it via Pages. @see ADR 0008
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: goatsoft/goatsoft.io
          publish_branch: main
          publish_dir: apps/goatsoft.io/dist
          cname: goatsoft.io
          force_orphan: true
      # Record a GitHub deployment on THIS repo so the Deployments panel shows
      # the live site (peaceiris only pushes to goatsoft.io, it logs nothing here).
      - name: Record deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const deployment = await github.rest.repos.createDeployment({
              owner, repo,
              ref: context.sha,
              environment: 'goatsoft.io',
              required_contexts: [],
              auto_merge: false,
              transient_environment: false,
              production_environment: true,
              description: 'Published to goatsoft.io',
            })
            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://goatsoft.io/',
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: 'Live on goatsoft.io',
            })
